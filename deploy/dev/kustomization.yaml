apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: data-pipeline-dev

resources:
- namespace.yaml
- ../base

secretGenerator:
- name: mysql-secret
  envs:
  - .env
  options:
    disableNameSuffixHash: true
- name: airflow-secret
  envs:
  - .env
  options:
    disableNameSuffixHash: true

images:
- name: 7104267/airflow-prod-app
  newTag: latest
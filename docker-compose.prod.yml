services:
  mysql-prod:
    image: mysql:8.0
    container_name: mysql-prod
    env_file:
      - .env.prod
    ports:
      - "3308:3306"
    volumes:
      - mysql-prod-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - prod-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-prod:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: airflow-prod
    env_file:
      - .env.prod
    ports:
      - "8082:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow-prod-logs:/opt/airflow/logs
    networks:
      - prod-network
    depends_on:
      mysql-prod:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-prod-data:
  airflow-prod-logs:

networks:
  prod-network:
    driver: bridge